[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lex-stream-cipher"
version = "1.0.0"
description = "LEX (Leak EXtraction) stream cipher in pure Python - coursework implementation"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
